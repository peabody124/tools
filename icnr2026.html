    <script>
    (function () {
        'use strict';

        const DATA = JSON.parse(document.getElementById('program-data').textContent);
        const CONF = DATA.conference || {};
        const TZ = CONF.timezone || 'UTC';
        const STORE_KEY = 'icnr2026-starred';

        const TYPE_LABELS = {
            keynote: 'Plenary lecture', workshop: 'Pre-conference workshop',
            rwr: 'Track A · Rehabilitation & Wearable Robotics', aicm: 'Track B · AI & Computational Methods',
            cmc: 'Track C · Clinical Motor Control', nis: 'Track D · Neural Interfaces & Stimulation',
            ctit: 'Track E · Clinical Translation & Industry', spotlight: 'Spotlight', poster: 'Exhibition & posters',
            social: 'Social program', tour: 'Lab tour', ceremony: 'Ceremony', break: 'Break', other: 'Other'
        };
        const CARD_LABELS = {
            keynote: 'Plenary lecture', workshop: 'Workshop', rwr: 'Track A · Robotics', aicm: 'Track B · AI',
            cmc: 'Track C · Motor control', nis: 'Track D · Neural interfaces', ctit: 'Track E · Translation'
        };
        const CHIP_LABELS = {
            keynote: 'Plenaries', workshop: 'Workshops', rwr: 'A · Robotics', aicm: 'B · AI', cmc: 'C · Motor control',
            nis: 'D · Neural interfaces', ctit: 'E · Translation', spotlight: 'Spotlight', poster: 'Posters',
            social: 'Social', tour: 'Lab tours', ceremony: 'Ceremony', break: 'Breaks', other: 'Other'
        };

        // ---------- Normalise data ----------
        const sessions = (DATA.sessions || []).map((s, i) => {
            const type = TYPE_LABELS[s.type] ? s.type : 'other';
            const talks = s.talks || [];
            const haystack = [
                s.title, s.room, s.description, s.subtitle, TYPE_LABELS[type], s.code,
                (s.chairs || []).join(' '), (s.speakers || []).join(' '), (s.organizers || []).join(' '), (s.moderators || []).join(' '),
                talks.map(t => [t.title, t.authors, t.presenter, t.id].join(' ')).join(' ')
            ].join(' ').toLowerCase();
            return Object.assign({}, s, {
                id: s.id || ('s' + i),
                type, talks, haystack,
                startMin: toMin(s.start), endMin: toMin(s.end || s.start)
            });
        }).sort((a, b) => a.date.localeCompare(b.date) || a.startMin - b.startMin || (a.room || '~').localeCompare(b.room || '~') || a.endMin - b.endMin);

        const byId = new Map(sessions.map(s => [s.id, s]));
        const dates = [...new Set(sessions.map(s => s.date))].sort();
        const types = Object.keys(TYPE_LABELS).filter(t => sessions.some(s => s.type === t));
        const rooms = [...new Set(sessions.map(s => s.room).filter(Boolean))].sort();

        function toMin(t) { if (!t) return 0; const [h, m] = t.split(':').map(Number); return h * 60 + (m || 0); }
        function esc(str) { return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
        function dateObj(d) { const [y, m, dd] = d.split('-').map(Number); return new Date(Date.UTC(y, m - 1, dd, 12)); }
        function fmtDay(d, opts) { return dateObj(d).toLocaleDateString(undefined, Object.assign({ timeZone: 'UTC' }, opts)); }

        // ---------- Persistence: localStorage with cookie fallback ----------
        function readCookie() {
            const m = document.cookie.match(new RegExp('(?:^|; )' + STORE_KEY + '=([^;]*)'));
            return m ? decodeURIComponent(m[1]) : null;
        }
        function loadStarred() {
            let raw = null;
            try { raw = localStorage.getItem(STORE_KEY); } catch (e) { }
            if (!raw) raw = readCookie();
            try { return new Set(JSON.parse(raw || '[]')); } catch (e) { return new Set(); }
        }
        function saveStarred() {
            const raw = JSON.stringify([...starred]);
            try { localStorage.setItem(STORE_KEY, raw); } catch (e) { }
            try { document.cookie = STORE_KEY + '=' + encodeURIComponent(raw) + ';max-age=31536000;path=/;SameSite=Lax'; } catch (e) { }
        }
        function loadPref(k, def) { try { const v = localStorage.getItem('icnr2026-' + k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } }
        function savePref(k, v) { try { localStorage.setItem('icnr2026-' + k, JSON.stringify(v)); } catch (e) { } }

        // ---------- State ----------
        const starred = loadStarred();
        const state = {
            day: null,
            query: '',
            mine: false,
            hiddenTypes: new Set(loadPref('hiddenTypes', [])),
            room: '',
            open: new Set()
        };

        // Shared-schedule links: #mine=id1,id2
        function importFromHash() {
            const h = decodeURIComponent(location.hash.slice(1));
            if (h.startsWith('mine=')) {
                const ids = h.slice(5).split(',').filter(id => byId.has(id));
                if (ids.length && confirm('Add ' + ids.length + ' shared session(s) to your starred list?')) {
                    ids.forEach(id => starred.add(id));
                    saveStarred();
                    state.mine = true;
                }
                history.replaceState(null, '', location.pathname + location.search);
                return null;
            }
            return byId.has(h) ? h : null;
        }

        // ---------- "Now" in conference timezone ----------
        function nowInConf() {
            const parts = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date());
            const p = Object.fromEntries(parts.map(x => [x.type, x.value]));
            return { date: `${p.year}-${p.month}-${p.day}`, min: Number(p.hour) * 60 + Number(p.minute) };
        }
        function isNow(s, now) { return s.date === now.date && now.min >= s.startMin && now.min < s.endMin; }

        // ---------- Rendering ----------
        const $ = id => document.getElementById(id);

        function renderHeader() {
            $('confName').textContent = CONF.name || 'Conference Program';
            document.title = CONF.short || CONF.name || document.title;
            const bits = [];
            if (dates.length) bits.push(fmtDay(dates[0], { month: 'short', day: 'numeric' }) + (dates.length > 1 ? ' – ' + fmtDay(dates[dates.length - 1], { month: 'short', day: 'numeric', year: 'numeric' }) : ''));
            if (CONF.location) bits.push(CONF.location);
            bits.push(sessions.filter(s => s.type !== 'break').length + ' sessions');
            $('confMeta').textContent = bits.join(' · ');
            const src = [];
            if (CONF.url) src.push(`<a href="${esc(CONF.url)}" target="_blank" rel="noopener">Conference website</a>`);
            if (CONF.source) src.push(`<a href="${esc(CONF.source)}" target="_blank" rel="noopener">Official program (PDF)</a>`);
            $('footer').innerHTML = (src.length ? src.join(' · ') + '<br>' : '') +
                'Times shown in local conference time' + (TZ !== 'UTC' ? ' (' + esc(TZ) + ')' : '') + '. Stars are saved on this device. Always check the official program for last-minute changes.';
        }

        function renderDays() {
            const html = [`<button class="day-tab ${state.day === 'all' ? 'active' : ''}" data-day="all" role="tab"><div class="dow">All</div><div class="dnum">days</div></button>`]
                .concat(dates.map(d => `<button class="day-tab ${state.day === d ? 'active' : ''}" data-day="${d}" role="tab" aria-selected="${state.day === d}">
                    <div class="dow">${esc(fmtDay(d, { weekday: 'short' }))}</div><div class="dnum">${esc(fmtDay(d, { month: 'short', day: 'numeric' }))}</div></button>`));
            $('days').innerHTML = html.join('');
            const active = $('days').querySelector('.active');
            if (active) active.scrollIntoView({ block: 'nearest', inline: 'center' });
        }

        function renderFilters() {
            let html = types.map(t => `<button class="chip ${state.hiddenTypes.has(t) ? 'off' : ''}" data-type="${t}" aria-pressed="${!state.hiddenTypes.has(t)}">
                <span class="dot" style="background:var(--t-${t})"></span>${esc(CHIP_LABELS[t])}</button>`).join('');
            if (rooms.length > 1) {
                html += `<label class="chip room-select"><select id="roomSel" aria-label="Filter by room"><option value="">All rooms</option>${rooms.map(r => `<option ${state.room === r ? 'selected' : ''}>${esc(r)}</option>`).join('')}</select></label>`;
            }
            $('filters').innerHTML = html;
        }

        function highlight(text, q) {
            const safe = esc(text);
            if (!q) return safe;
            const terms = q.split(/\s+/).filter(Boolean).map(t => esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
            if (!terms.length) return safe;
            return safe.replace(new RegExp('(' + terms.join('|') + ')', 'gi'), '<mark>$1</mark>');
        }

        function matches(s) {
            if (state.mine && !starred.has(s.id)) return false;
            if (state.hiddenTypes.has(s.type) && !state.query) return false;
            if (state.room && s.room !== state.room) return false;
            if (state.query) {
                const terms = state.query.toLowerCase().split(/\s+/).filter(Boolean);
                if (!terms.every(t => s.haystack.includes(t))) return false;
            }
            return true;
        }

        function sessionCard(s, now) {
            const q = state.query;
            const open = state.open.has(s.id) || (q && s.talks.some(t => [t.title, t.authors, t.presenter].join(' ').toLowerCase().includes(q.toLowerCase())));
            const live = isNow(s, now);
            const sub = [];
            if (s.room) sub.push(`<span>📍 ${highlight(s.room, q)}</span>`);
            if (s.speakers && s.speakers.length && s.type !== 'break') sub.push(`<span>${highlight(s.speakers.join(', '), q)}</span>`);
            const hasDetails = s.description || s.talks.length || (s.chairs && s.chairs.length) || (s.organizers && s.organizers.length) || s.subtitle;
            if (s.talks.length) sub.push(`<span class="chev">${s.talks.length} talks</span>`);
            else if (hasDetails) sub.push(`<span class="chev">Details</span>`);
            const talkNo = i => String(i + 1);
            const isBreak = s.type === 'break';

            let details = '';
            if (hasDetails) {
                details = `<div class="details">
                    ${CARD_LABELS[s.type] && TYPE_LABELS[s.type] !== CARD_LABELS[s.type] ? `<div class="track">${esc(TYPE_LABELS[s.type])}</div>` : ''}
                    ${s.subtitle ? `<div class="people">${highlight(s.subtitle, q)}</div>` : ''}
                    ${s.organizers && s.organizers.length ? `<div class="people"><b>Organizers:</b> ${highlight(s.organizers.join('; '), q)}</div>` : ''}
                    ${s.chairs && s.chairs.length ? `<div class="people"><b>Chair${s.chairs.length > 1 ? 's' : ''}:</b> ${highlight(s.chairs.join('; '), q)}</div>` : ''}
                    ${s.moderators && s.moderators.length ? `<div class="people"><b>Moderators:</b> ${highlight(s.moderators.join('; '), q)}</div>` : ''}
                    ${s.description ? `<div class="desc">${highlight(s.description, q)}</div>` : ''}
                    ${s.talks.length ? `<ul class="talks">${s.talks.map((t, i) => `<li>
                        <span class="t-time">${esc(t.time || talkNo(i) + '.')}${t.id ? `<div class="t-id">${highlight(t.id, q)}</div>` : ''}</span>
                        <span class="t-title">${highlight(t.title || '', q)}</span>
                        ${t.authors || t.presenter ? `<span class="t-authors">${highlight(t.authors || t.presenter, q)}</span>` : ''}
                    </li>`).join('')}</ul>` : ''}
                    <div class="detail-actions">
                        <button data-act="ics" data-id="${s.id}">📅 Add to calendar</button>
                        <button data-act="link" data-id="${s.id}">🔗 Copy link</button>
                    </div>
                </div>`;
            }
            return `<article class="session ${isBreak ? 'break' : ''} ${open ? 'open' : ''} ${live ? 'is-now' : ''}" id="${s.id}" style="--type-color:var(--t-${s.type})">
                <div class="session-head">
                    <button class="main" data-act="toggle" data-id="${s.id}" aria-expanded="${!!open}">
                        ${isBreak ? '' : `<div class="kind">${live ? '<span class="badge-now">NOW</span>' : ''}${esc(CARD_LABELS[s.type] || TYPE_LABELS[s.type])}${s.code ? ' · ' + highlight(s.code, q) : ''}</div>`}
                        <div class="title">${highlight(s.title, q)}</div>
                        ${sub.length ? `<div class="sub">${sub.join('')}</div>` : ''}
                    </button>
                    ${isBreak ? '' : `<button class="star ${starred.has(s.id) ? 'on' : ''}" data-act="star" data-id="${s.id}" aria-label="${starred.has(s.id) ? 'Unstar' : 'Star'} session" aria-pressed="${starred.has(s.id)}">${starred.has(s.id) ? '★' : '☆'}</button>`}
                </div>
                ${details}
            </article>`;
        }

        function render() {
            const now = nowInConf();
            const crossDay = state.day === 'all' || !!state.query || state.mine;
            const list = sessions.filter(s => (crossDay || s.date === state.day) && matches(s));

            const parts = [];
            let curDay = null, curSlot = null, buf = [];
            const flush = () => {
                if (!buf.length) return;
                const s0 = buf[0];
                parts.push(`<div class="slot"><div class="slot-time">${esc(s0.start)}<span class="end">${esc(s0.end || '')}</span></div>
                    <div class="slot-sessions ${buf.length > 1 ? 'multi' : ''}">${buf.map(s => sessionCard(s, now)).join('')}</div></div>`);
                buf = [];
            };
            for (const s of list) {
                if (crossDay && s.date !== curDay) {
                    flush();
                    curDay = s.date; curSlot = null;
                    parts.push(`<h2 class="day-heading">${esc(fmtDay(s.date, { weekday: 'long', month: 'long', day: 'numeric' }))}</h2>`);
                }
                const key = s.date + s.start;
                if (key !== curSlot) { flush(); curSlot = key; }
                buf.push(s);
            }
            flush();

            if (!list.length) {
                const msg = !sessions.length ? 'Program data has not been loaded yet.'
                    : state.mine ? 'No starred sessions yet. Tap ☆ on any session to add it to your schedule.'
                    : 'No sessions match your search or filters.';
                parts.push(`<div class="empty"><div class="big">${state.mine ? '☆' : '🔍'}</div>${esc(msg)}</div>`);
            }
            $('list').innerHTML = parts.join('');

            const label = state.query ? `${list.length} result${list.length === 1 ? '' : 's'} for “${esc(state.query)}”`
                : state.mine ? `${list.length} starred session${list.length === 1 ? '' : 's'}`
                : state.day === 'all' ? `${list.length} sessions` : `${list.length} sessions on ${esc(fmtDay(state.day, { weekday: 'long' }))}`;
            $('statusText').innerHTML = label;
            $('statusActions').innerHTML = state.mine && list.length
                ? `<a href="#" data-act="share">Share</a> · <a href="#" data-act="ics-all">Export .ics</a>` : '';

            $('myCount').textContent = starred.size;
            $('myBtn').classList.toggle('active', state.mine);
            $('myBtn').setAttribute('aria-pressed', state.mine);
            $('clearSearch').classList.toggle('show', !!state.query);
            $('days').style.opacity = crossDay && state.day !== 'all' ? '.5' : '1';

            const live = sessions.some(s => isNow(s, now));
            $('nowBtn').classList.toggle('show', live && !state.mine && !state.query);
        }

        // ---------- Calendar export ----------
        function icsDate(d, t) { return d.replace(/-/g, '') + 'T' + (t || '00:00').replace(':', '') + '00'; }
        function icsEsc(s) { return String(s || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/[,;]/g, m => '\\' + m); }
        function buildIcs(list) {
            const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//tools//ICNR2026//EN', 'CALSCALE:GREGORIAN'];
            for (const s of list) {
                const desc = [s.description, s.talks.map(t => (t.time ? t.time + ' ' : '') + t.title + (t.authors ? ' — ' + t.authors : '')).join('\n')].filter(Boolean).join('\n\n');
                lines.push('BEGIN:VEVENT', 'UID:' + s.id + '@icnr2026', 'DTSTAMP:' + new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z',
                    'DTSTART;TZID=' + TZ + ':' + icsDate(s.date, s.start), 'DTEND;TZID=' + TZ + ':' + icsDate(s.date, s.end || s.start),
                    'SUMMARY:' + icsEsc(s.title), 'LOCATION:' + icsEsc(s.room), 'DESCRIPTION:' + icsEsc(desc), 'END:VEVENT');
            }
            lines.push('END:VCALENDAR');
            return lines.join('\r\n');
        }
        function download(name, text) {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([text], { type: 'text/calendar' }));
            a.download = name;
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        }

        let toastTimer;
        function toast(msg) {
            const t = $('toast'); t.textContent = msg; t.classList.add('show');
            clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
        }
        async function copy(text, okMsg) {
            try {
                if (navigator.share && matchMedia('(pointer:coarse)').matches) { await navigator.share({ url: text }); return; }
                await navigator.clipboard.writeText(text); toast(okMsg);
            } catch (e) { prompt('Copy this link:', text); }
        }

        // ---------- Events ----------
        $('days').addEventListener('click', e => {
            const b = e.target.closest('.day-tab'); if (!b) return;
            state.day = b.dataset.day; state.mine = false; state.query = ''; $('search').value = '';
            savePref('day', state.day);
            renderDays(); render(); window.scrollTo({ top: 0 });
        });
        $('filters').addEventListener('click', e => {
            const b = e.target.closest('.chip[data-type]'); if (!b) return;
            const t = b.dataset.type;
            state.hiddenTypes.has(t) ? state.hiddenTypes.delete(t) : state.hiddenTypes.add(t);
            savePref('hiddenTypes', [...state.hiddenTypes]);
            renderFilters(); render();
        });
        $('filters').addEventListener('change', e => {
            if (e.target.id === 'roomSel') { state.room = e.target.value; render(); }
        });
        let searchTimer;
        $('search').addEventListener('input', e => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => { state.query = e.target.value.trim(); render(); }, 120);
        });
        $('clearSearch').addEventListener('click', () => { $('search').value = ''; state.query = ''; render(); $('search').focus(); });
        $('myBtn').addEventListener('click', () => { state.mine = !state.mine; render(); window.scrollTo({ top: 0 }); });
        $('nowBtn').addEventListener('click', () => {
            const now = nowInConf();
            state.day = now.date; state.mine = false; state.query = ''; $('search').value = '';
            renderDays(); render();
            const el = document.querySelector('.session.is-now');
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });

        document.addEventListener('click', e => {
            const b = e.target.closest('[data-act]'); if (!b) return;
            const s = byId.get(b.dataset.id);
            switch (b.dataset.act) {
                case 'toggle': {
                    const card = b.closest('.session');
                    if (!card.querySelector('.details')) return;
                    const open = card.classList.toggle('open');
                    open ? state.open.add(s.id) : state.open.delete(s.id);
                    b.setAttribute('aria-expanded', open);
                    break;
                }
                case 'star': {
                    starred.has(s.id) ? starred.delete(s.id) : starred.add(s.id);
                    saveStarred();
                    const on = starred.has(s.id);
                    b.classList.toggle('on', on); b.textContent = on ? '★' : '☆';
                    b.setAttribute('aria-pressed', on); b.setAttribute('aria-label', (on ? 'Unstar' : 'Star') + ' session');
                    $('myCount').textContent = starred.size;
                    toast(on ? 'Added to your schedule' : 'Removed from your schedule');
                    if (state.mine && !on) render();
                    break;
                }
                case 'ics': download(s.id + '.ics', buildIcs([s])); break;
                case 'link': copy(location.origin + location.pathname + '#' + s.id, 'Link copied'); break;
                case 'share': e.preventDefault(); copy(location.origin + location.pathname + '#mine=' + [...starred].join(','), 'Share link copied'); break;
                case 'ics-all': e.preventDefault(); download('icnr2026-my-schedule.ics', buildIcs(sessions.filter(x => starred.has(x.id)))); break;
            }
        });

        // Keep stars in sync across tabs
        window.addEventListener('storage', e => { if (e.key === STORE_KEY) { starred.clear(); loadStarred().forEach(id => starred.add(id)); render(); } });

        // ---------- Init ----------
        (function init() {
            const target = importFromHash();
            const now = nowInConf();
            const saved = loadPref('day', null);
            state.day = target ? byId.get(target).date
                : dates.includes(now.date) ? now.date
                : (saved && (saved === 'all' || dates.includes(saved))) ? saved
                : (dates[0] || 'all');
            if (target) state.open.add(target);
            renderHeader(); renderDays(); renderFilters(); render();
            if (target) { const el = document.getElementById(target); if (el) setTimeout(() => el.scrollIntoView({ block: 'center' }), 50); }
            window.addEventListener('hashchange', () => {
                const t = importFromHash();
                if (t) {
                    state.day = byId.get(t).date; state.mine = false; state.query = ''; $('search').value = '';
                    state.open.add(t);
                }
                renderDays(); render();
                if (t) { const el = document.getElementById(t); if (el) el.scrollIntoView({ block: 'center' }); }
            });
            setInterval(render, 60000);
        })();
    })();
    </script>
</body>
</html>
