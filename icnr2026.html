<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1f3b73">
    <title>ICNR 2026 Program</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --card: #ffffff;
            --text: #1a1a2e;
            --muted: #62677a;
            --line: #e1e4ea;
            --accent: #1f3b73;
            --accent-soft: #e6ecf8;
            --star: #f5a623;
            --now: #1e9e5a;
            --t-keynote: #c2185b;
            --t-workshop: #6a4fc9;
            --t-rwr: #e69a1f;
            --t-aicm: #e0584a;
            --t-cmc: #8c6d9e;
            --t-nis: #b0413e;
            --t-ctit: #4f8a3c;
            --t-spotlight: #c9a800;
            --t-poster: #16a085;
            --t-social: #2d6cdf;
            --t-tour: #0f8a9d;
            --t-ceremony: #c2185b;
            --t-break: #9aa0ac;
            --t-other: #7f8c8d;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #12141a;
                --card: #1c1f27;
                --text: #e8eaf0;
                --muted: #9aa1b2;
                --line: #2c303b;
                --accent: #8fb0ff;
                --accent-soft: #232c42;
            }
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.4;
        }
        button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
        a { color: var(--accent); }

        /* ---------- Header ---------- */
        header.top {
            background: #1f3b73;
            color: #fff;
            padding: 14px 16px 10px;
            padding-top: calc(14px + env(safe-area-inset-top));
        }
        .top-inner { max-width: 1000px; margin: 0 auto; }
        .top h1 { font-size: 20px; font-weight: 700; }
        .top .meta { font-size: 13px; opacity: .85; margin-top: 2px; }

        .toolbar {
            position: sticky; top: 0; z-index: 20;
            background: var(--card);
            border-bottom: 1px solid var(--line);
            box-shadow: 0 2px 6px rgba(0,0,0,.06);
        }
        .toolbar-inner { max-width: 1000px; margin: 0 auto; padding: 8px 12px; }
        .search-row { display: flex; gap: 8px; align-items: center; }
        .search-wrap { position: relative; flex: 1; }
        .search-wrap input {
            width: 100%;
            font-size: 16px; /* prevents iOS zoom */
            padding: 9px 34px 9px 12px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: var(--bg);
            color: var(--text);
        }
        .search-wrap input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
        .clear-search {
            position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
            width: 26px; height: 26px; border-radius: 50%;
            color: var(--muted); font-size: 18px; line-height: 1;
            display: none;
        }
        .clear-search.show { display: block; }
        .icon-btn {
            flex: none;
            height: 38px; min-width: 38px; padding: 0 10px;
            border-radius: 10px;
            border: 1px solid var(--line);
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            font-size: 14px; font-weight: 600;
            white-space: nowrap;
        }
        .icon-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
        @media (prefers-color-scheme: dark) { .icon-btn.active { color: #12141a; } }
        .icon-btn .count {
            background: var(--star); color: #fff; border-radius: 9px;
            font-size: 11px; padding: 1px 6px; min-width: 18px;
        }

        .days, .filters {
            display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
            padding-top: 8px;
            -webkit-overflow-scrolling: touch;
        }
        .days::-webkit-scrollbar, .filters::-webkit-scrollbar { display: none; }
        .day-tab {
            flex: none;
            padding: 6px 12px; border-radius: 10px;
            border: 1px solid var(--line);
            text-align: center; line-height: 1.15;
        }
        .day-tab .dow { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
        .day-tab .dnum { font-size: 15px; font-weight: 700; }
        .day-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
        .day-tab.active .dow { color: rgba(255,255,255,.85); }
        @media (prefers-color-scheme: dark) {
            .day-tab.active { color: #12141a; }
            .day-tab.active .dow { color: rgba(0,0,0,.7); }
        }
        .chip {
            flex: none;
            font-size: 13px; padding: 4px 10px; border-radius: 999px;
            border: 1px solid var(--line);
            display: inline-flex; align-items: center; gap: 6px;
        }
        .chip .dot { width: 8px; height: 8px; border-radius: 50%; }
        .chip.off { opacity: .45; text-decoration: line-through; }
        .chip.room-select { padding: 0; }
        .chip select {
            font: inherit; font-size: 13px; color: inherit; background: transparent;
            border: none; padding: 4px 8px; border-radius: 999px; max-width: 180px;
        }

        /* ---------- Main ---------- */
        main { max-width: 1000px; margin: 0 auto; padding: 12px 12px 90px; }
        .status-line { font-size: 13px; color: var(--muted); margin: 4px 2px 10px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
        .day-heading {
            font-size: 15px; font-weight: 700; margin: 18px 2px 8px;
            color: var(--accent);
        }
        .slot { display: grid; grid-template-columns: 62px 1fr; gap: 10px; margin-bottom: 12px; }
        .slot-time {
            font-variant-numeric: tabular-nums;
            font-weight: 700; font-size: 14px; padding-top: 10px; text-align: right;
        }
        .slot-time .end { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
        .slot-sessions { display: grid; gap: 8px; min-width: 0; }
        @media (min-width: 760px) {
            .slot { grid-template-columns: 80px 1fr; }
            .slot-sessions.multi { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); align-items: start; }
        }

        .session {
            background: var(--card);
            border-radius: 12px;
            border-left: 5px solid var(--type-color, var(--t-other));
            box-shadow: 0 1px 3px rgba(0,0,0,.07);
            overflow: hidden;
            min-width: 0;
        }
        .session.is-now { box-shadow: 0 0 0 2px var(--now), 0 1px 3px rgba(0,0,0,.07); }
        .session.break { box-shadow: none; background: transparent; border-left: 3px solid var(--line); border-radius: 0; }
        .session-head {
            display: flex; gap: 8px; align-items: flex-start;
            padding: 10px 8px 10px 12px;
            width: 100%; text-align: left;
        }
        .session-head .main { flex: 1; min-width: 0; text-align: left; display: block; }
        .session .kind {
            font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
            color: var(--type-color, var(--t-other));
            display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
        }
        .badge-now { background: var(--now); color: #fff; border-radius: 4px; padding: 0 5px; letter-spacing: .03em; }
        .session .title { font-size: 15px; font-weight: 650; margin-top: 2px; overflow-wrap: anywhere; }
        .session .sub { font-size: 13px; color: var(--muted); margin-top: 3px; overflow-wrap: anywhere; }
        .session .sub span + span::before { content: " · "; }
        .star {
            flex: none; width: 40px; height: 40px; margin: -6px -2px 0 0;
            font-size: 22px; line-height: 1; color: var(--muted);
            border-radius: 50%;
        }
        .star.on { color: var(--star); }
        .star:active { transform: scale(.9); }
        .chev { color: var(--accent); font-weight: 600; white-space: nowrap; }
        .chev::after { content: " ▾"; }
        .session.open .chev::after { content: " ▴"; }
        .session.break .session-head { padding: 6px 12px; }
        .session.break .title { font-size: 14px; font-weight: 500; color: var(--muted); margin: 0; }
        .details .track { font-size: 12px; color: var(--muted); margin-top: 10px; }

        .details { display: none; padding: 0 12px 12px; border-top: 1px solid var(--line); }
        .session.open .details { display: block; }
        .details .desc { font-size: 14px; margin-top: 10px; white-space: pre-line; overflow-wrap: anywhere; }
        .details .people { font-size: 13px; margin-top: 8px; color: var(--muted); }
        .details .people b { color: var(--text); font-weight: 600; }
        .talks { list-style: none; margin-top: 10px; }
        .talks li { padding: 8px 0; border-top: 1px dashed var(--line); display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
        .talks li:first-child { border-top: none; }
        .talks .t-time { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); padding-top: 2px; min-width: 38px; }
        .talks .t-title { font-size: 14px; font-weight: 550; overflow-wrap: anywhere; }
        .talks .t-authors { grid-column: 2; font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
        .talks .t-id { font-size: 11px; color: var(--muted); font-weight: 600; }
        .detail-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        .detail-actions button, .detail-actions a {
            font-size: 13px; padding: 6px 10px; border-radius: 8px;
            border: 1px solid var(--line); text-decoration: none; color: var(--text);
        }
        mark { background: #ffe58a; color: inherit; border-radius: 2px; }
        @media (prefers-color-scheme: dark) { mark { background: #6b5a12; } }

        .empty { text-align: center; color: var(--muted); padding: 50px 16px; }
        .empty .big { font-size: 40px; margin-bottom: 8px; }

        .fab {
            position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom));
            z-index: 30;
            background: var(--now); color: #fff;
            padding: 10px 16px; border-radius: 999px;
            font-weight: 700; font-size: 14px;
            box-shadow: 0 4px 12px rgba(0,0,0,.2);
            display: none;
        }
        .fab.show { display: block; }

        .toast {
            position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%);
            background: #222; color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 14px;
            opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 40;
        }
        .toast.show { opacity: .95; }

        footer { max-width: 1000px; margin: 0 auto; padding: 0 16px 40px; font-size: 12px; color: var(--muted); }
        footer a { color: var(--muted); }
    </style>
</head>
<body>
    <header class="top">
        <div class="top-inner">
            <h1 id="confName">ICNR 2026 Program</h1>
            <div class="meta" id="confMeta"></div>
        </div>
    </header>

    <div class="toolbar">
        <div class="toolbar-inner">
            <div class="search-row">
                <div class="search-wrap">
                    <input id="search" type="search" placeholder="Search talks, authors, rooms…" autocomplete="off" aria-label="Search program">
                    <button class="clear-search" id="clearSearch" aria-label="Clear search">×</button>
                </div>
                <button class="icon-btn" id="myBtn" aria-pressed="false" title="Show only my starred sessions">★ <span class="lbl">Mine</span> <span class="count" id="myCount">0</span></button>
            </div>
            <div class="days" id="days" role="tablist" aria-label="Conference days"></div>
            <div class="filters" id="filters" aria-label="Session type filters"></div>
        </div>
    </div>

    <main>
        <div class="status-line"><span id="statusText"></span><span id="statusActions"></span></div>
        <div id="list"></div>
    </main>

    <footer id="footer"></footer>

    <button class="fab" id="nowBtn">● Happening now</button>
    <div class="toast" id="toast"></div>

latform for Early Rehabilitation","authors":"Juan Fang, Capucine Nicolet, Michael Haldimann and Niklaus Stocker"},{"id":"ID262","title":"Aftereffects of Step Length Asymmetry Induced by a Commercial Hip Exoskeleton","authors":"Minhye Kim, Jaewoo Cho, Hong Min and Jooeun Ahn"},{"id":"ID265","title":"Home-Based Exosuit Intervention Improves Walking Mobility and Daily Activity in Community-Dwelling Stroke Survivors","authors":"Byeori Han, Jinkyu Lee and Won-Kyung Song"},{"id":"ID247","title":"Exploratory Clinical Application of an EMG-based Motion Intention– Driven Hand Rehabilitation Robot","authors":"Jumpei Arata, Nobutaka Mukae, Takashi Takebayashi and Hiroshi Kanatani"},{"id":"ID395","title":"Design and Analysis of Controllers for Lower-Limb Exoskeleton Mannequin for Evaluating Interactions at the Coupling Interface","authors":"Christian Mele, James Tung and Katja Mombaur"}]},{"id":"plenary-huang","date":"2026-09-30","start":"08:30","end":"09:15","type":"keynote","title":"Embodiment from Both Sides: Towards Human-Prosthesis Symbiosis","speakers":["He (Helen) Huang, Ph.D."],"subtitle":"Jackson Family Distinguished Professor, Lampe Joint Department of Biomedical Engineering, North Carolina State University and the University of North Carolina at Chapel Hill","room":"Room A","moderators":["Prof. Jiyeon Kang","Prof. Bong-Keun Jung"],"description":"As the population with limb loss in the U.S. grows to millions, there is an urgent need for new prosthetic technologies that can provide this large population with the best restoration of normal function possible. Advanced robotic prostheses, such as motorized prosthetic legs, have become commercially available. However, the function and acceptance of these robotic devices are still limited. In this talk, I will introduce my lab's recent research toward building a symbiotic relationship between humans and robotic prosthetic legs. In our previous work, we successfully embodied AI into robotic prosthesis control to personalize walking assistance for individual users. However, this technology has been limited to restoring gait patterns in robotic devices without addressing the user's physical and cognitive function in clinical settings. We aim to resolve these challenges by investigating clinician-AI teaming, reformulating a human-prosthesis hybrid reward function for embodied AI, and quantifying prosthesis embodiment during human-prosthesis co-adaptation. Our innovation will further advance the function of modern, intelligent prostheses and improve the quality of life of individuals with limb amputations.\n\nAbout the speaker: Dr. Helen Huang is the Jackson Family Distinguished Professor in the Joint Department of Biomedical Engineering at North Carolina State University (NC State) and the University of North Carolina at Chapel Hill (UNC) and the Director of the Closed-Loop Engineering for Advanced Rehabilitation (CLEAR) core. Her research interests lie in neural-machine interfaces, wearable robotics (robotic prosthetics and exoskeletons), learning-based wearable robot control, wearer-robot interaction and co-adaptation, and human motor control/ biomechanics. She was a recipient of the Delsys Prize for Innovation in Electromyography, NIDILRR Switzer Fellowship, NSF CAREER Award, ASA Statistics in Physical Engineering Sciences Award, and NC State ALCOA Foundation Distinguished Engineering Research Award. She is a Fellow of AIMBE, a Fellow of IEEE, and a NC State faculty scholar. She is currently the Editor-in-Chief for the IEEE Transactions on Neural Systems and Rehabilitation Engineering and an Editorial Board Member for IEEE Transactions on Biomedical Engineering.","talks":[]},{"id":"plenary-oh","date":"2026-09-30","start":"13:45","end":"14:30","type":"keynote","title":"Beyond Classification: Predicting Functional Recovery in Neurorehabilitation","speakers":["Byung-Mo Oh, MD, PhD"],"subtitle":"Professor and Chair, Department of Rehabilitation Medicine, Seoul National University Hospital and University College of Medicine, Seoul, South Korea","room":"Room A","moderators":["Prof. Hyung-Soon Park","Prof. Jaewon Beom"],"description":"Quantitative assessment of swallowing provides a framework for investigating the relationships between movement physiology, functional impairment, and recovery following neurological injury. Videofluoroscopic swallowing studies (VFSS) enable the characterization of complex spatiotemporal interactions among oropharyngeal structures and bolus transit. Clinical translation of these measurements requires validation appropriate to their intended use, including evidence of measurement reliability, discriminative performance, and prognostic relevance. This lecture synthesizes findings from four studies examining complementary aspects of quantitative swallowing assessment. The development and verification of the Spatio-Temporal Analyzer for Motion and Physiologic Study (STAMPS) established a methodological basis for reproducible kinematic analysis. The other studies examined support vector machine classification of healthy and dysphagic swallowing using hyoid movement features, kinematic characteristics associated with poor recovery in post-stroke dysphagia, and a Bayesian network model incorporating clinical and neuroimaging variables to predict six-month swallowing outcomes after ischemic stroke. These investigations illustrate the distinct evidentiary requirements for measurement, classification, and prognostication. Particular consideration is given to physiological interpretability, cohort characteristics, temporal definitions of recovery, and limitations in generalizability. Prognostic associations require further investigation before informing treatment selection, and the clinical utility of prediction models must be established by evaluating their effects on decision-making and patient outcomes. The lecture also introduces an ongoing VFSS foundation model study designed to investigate whether shared video representations can support multiple functional assessments. Using swallowing as a clinical model, this lecture identifies methodological and translational considerations applicable to quantitative assessment and recovery prediction across neurorehabilitation.\n\nAbout the speaker: Byung-Mo Oh, MD, PhD is a Clinical Professor and Chair of the Department of Rehabilitation Medicine at Seoul National University Hospital and Seoul National University College of Medicine in Seoul, Republic of Korea. He is a board-certified physiatrist with extensive clinical and research expertise in neurorehabilitation, with particular emphasis on traumatic brain injury, concussion, and dysphagia. His research interests span blood-based biomarkers for TBI prognostication, swallowing biomechanics, and technology-assisted rehabilitation, including robotics and artificial intelligence–driven diagnostic and therapeutic tools. Dr. Oh has also conducted multiple studies on brain–computer interface– based rehabilitation systems for individuals with severe physical disabilities. He currently serves as Editor-in-Chief of Annals of Rehabilitation Medicine and as Associate Editor of several international journals, including Dysphagia and PM&R. Through national and industry-funded research projects and active international collaboration, he continues to contribute to the advancement of global neurorehabilitation research and education.","talks":[]},{"id":"plenary-fregly","date":"2026-10-01","start":"08:30","end":"09:15","type":"keynote","title":"Computational Design of Personalized Treatments for Movement Impairments: From Vision to Reality","speakers":["Prof. B.J. Fregly, PhD"],"subtitle":"Departments of Mechanical Engineering and Bioengineering, Rice University, Houston, TX, USA","room":"Room A","moderators":["Prof. Jose L. Pons","Dr. Jesus Tornero"],"description":"This plenary lecture will cover the history of how the Neuromusculoskeletal Modeling (NMSM) Pipeline – software that makes it possible to use personalized neuromusculoskeletal computer models to design clinical treatments for movement impairments – went from being a research vision to a practical reality over a 25-year time period. The lecture will provide background on how computer-aided engineering software capabilities germinated the vision, new technical developments required to fulfill the vision, early research efforts to initiate the vision, subsequent research efforts to pursue the vision, and finally recent software development efforts to fulfill the vision. The final result is the NMSM Pipeline software, which turns the entire neuromusculoskeletal Model Personalization and Treatment Optimization process into a codified series of steps within commercial-grade software. Built in the MATLAB programming environment on top of Stanford’s OpenSim musculoskeletal modeling software, the NMSM Pipeline requires no coding to use and fills an important gap in getting neuromusculoskeletal modeling research across the “valley of death” from interesting research to clinical applicability. Examples of personalized computational treatment design to improve walking function will be presented for gait modification to treat knee osteoarthritis, high tibial osteotomy surgery to treat knee osteoarthritis, neural control prediction to simulate faster speed walking post-stroke, and extensive orthopedic surgery to treat pelvic cancer.\n\nAbout the speaker: B.J. Fregly received his Bachelor’s degree from Princeton University (1986) and his Masters and Ph.D. degrees from Stanford University (1987 and 1993) in Mechanical Engineering. Following a year of post-doctoral research at the University of Lyon in France (1993-1994), Dr. Fregly worked as a software developer in Silicon Valley for Rasna/Parametric Technology Corporation (1995-1999). From 1999 to 2017, he served on the faculty of the Department of Mechanical & Aerospace Engineering at the University of Florida, where he was a Knox T. Millsaps Professor, a University of Florida Research Foundation Professor, and the recipient of department and college Teacher of the Year awards. In August of 2017, Dr. Fregly joined the Department of Mechanical Engineering at Rice University as a Professor and CPRIT Scholar in Cancer Research. His research focuses on modeling, simulation, and optimization of the human neuromusculoskeletal system with the goal of designing highly effective personalized treatments for movement impairments. To date, the three primary clinical application areas have been stroke, osteoarthritis, and pelvic cancer. Dr. Fregly has been the PI on over $13 million in research funding primarily from the National Science Foundation (including a CAREER Award), the National Institutes of Health, and the Cancer Prevention and Research Institute of Texas. Most recently, Dr. Fregly has directed the development of the Neuromusculoskeletal Modeling Pipeline (https://nmsm.rice.edu), which is Matlab-based software that adds model personalization and treatment optimization functionality to OpenSim. At Rice, Dr. Fregly has also served as a magister overseeing Brown College, a residential housing community of approximately 400 undergraduate students.","talks":[]},{"id":"plenary-young","date":"2026-10-01","start":"13:45","end":"14:30","type":"keynote","title":"A Unifying Approach for Task Agnostic Control of Wearable Robotics in Neurologically Impaired Populations","speakers":["Aaron Young, Ph.D."],"subtitle":"George W. Woodruff School of Mechanical Engineering, Georgia Institute of Technology, Atlanta, GA, USA","room":"Room A","moderators":["Prof. Hyung-Soon Park","Prof. Song Joo Lee"],"description":"New end-to-end task agnostic AI systems have transformed the ability of wearable robotics to provide meaningful assistance to users across a diverse range of daily activities as well as user populations. Traditional control methods have often relied on activity classification, state machine, heuristic tuning variables and procedures which are challenging to scale to real-world human movement. This talk will present a unifying approach to task agnostic wearable robotic control through real time deep learning of human biomechanical states that removes the need for manual tuning of controllers or explicit knowledge of the task the user is performing. Outcome measures from related human subject experiments with test scenarios of these systems will be presented focused on both industrial and recreational tasking in able bodied adults using light-weight, clothing integrated, multi-joint exoskeletons. Furthermore, techniques for successful clinical translation of these systems to individuals with neurological gait impairment will be discussed. Relevant human outcomes from a recent clinical trial performed in individuals with stroke using end-to-end task agnostic control across numerous tasks will be presented.\n\nAbout the speaker: Aaron Young is an Associate Professor and Woodruff Faculty Fellow in the Woodruff School of Mechanical Engineering at Georgia Tech and has directed the Exoskeleton and Prosthetic Intelligent Controls (EPIC) lab since 2016. Dr. Young received his MS and PhD degrees in Biomedical Engineering with a focus on neural and rehabilitation engineering from Northwestern University in 2011 and 2014 respectively. He received a BS degree in Biomedical Engineering from Purdue University in 2009. He also completed a post-doctoral fellowship at the University of Michigan in the Human Neuromechanics Lab working with lower limb exoskeletons and powered orthoses to augment human performance. His research area is in advanced control systems for robotic prosthetic and exoskeleton systems for humans with movement impairment. He combines machine learning, robotics, human biomechanics, and control systems to design wearable robots to improve the community mobility of individuals with walking disability. He has received an NIH New Innovator Award (DP2), NIH NCMRR New Investigator award and IEEE New Faces of Engineering award, and his EPIC lab group won the International VIP Consortium Innovation Competition. He is a Senior Member of the IEEE and serves as an Editor / Associate Editor for BioRob and Rehab Week/ICORR.","talks":[]},{"id":"plenary-hofstoetter","date":"2026-10-02","start":"08:30","end":"09:15","type":"keynote","title":"Harnessing Spinal Motor Capacity: A New Era in Neurorehabilitation","speakers":["Prof. Ursula Hofstoetter, PhD"],"subtitle":"Center for Medical Physics and Biomedical Engineering, Medical University of Vienna, Vienna, Austria","room":"Room A","moderators":["Prof. Denny Oetomo","Prof. Junho Choi"],"description":"The spinal cord possesses remarkable intrinsic capacity to generate and modulate locomotor activity. From the discovery and characterization of spinal central pattern generators in experimental animals to emerging evidence of their functional relevance in humans, research has progressively reshaped our understanding of the spinal cord as more than a passive conduit for supraspinal commands. This talk will explore how this latent motor capacity can be harnessed after spinal cord injury. In particular, it will discuss epidural electrical stimulation and transcutaneous spinal cord stimulation as approaches to engage spinal locomotor networks, enhance residual motor function, and support neurorehabilitation. Together, these advances open new avenues for translating fundamental insights into spinal motor control into meaningful therapeutic strategies for people with spinal cord injury.\n\nAbout the speaker: Ursula Hofstoetter is a neuroscientist and biomedical engineer specializing in human spinal cord physiology, motor control, and neuromodulation, with a particular focus on rehabilitation after spinal cord injury. She co-heads the Human Motor Control and Neuromodulation research group at the Medical University of Vienna, where her work bridges fundamental neuroscience, clinical research, and the conception of accessible neurorehabilitation regimens. Ursula Hofstoetter obtained her Ph.D. in Technical Mathematics from the Vienna University of Technology and has since focused on elucidating the functional organization of human spinal locomotor circuits and their modulation through invasive and non-invasive stimulation techniques. Her research aims to develop and translate innovative neuromodulation strategies to improve motor function and reduce spasticity in individuals with spinal cord injury and other neurological disorders. She has led and contributed to numerous national and international research projects, supervised students across disciplines, and maintains an established track record of high-impact publications. Her work has received international recognition, including the DSQ Research Award for outstanding contributions to spinal cord movement control and rehabilitation.","talks":[]},{"id":"plenary-castellini","date":"2026-10-02","start":"13:45","end":"14:30","type":"keynote","title":"Interactive Learning: Structuring the User’s Central Role in Assistive Robotics","speakers":["Prof. Claudio Castellini, Ph.D."],"subtitle":"Friedrich-Alexander-Universität Erlangen-Nürnberg, Germany","room":"Room A","moderators":["Prof. Won-Seok Kim","Dr. Sangjoon Kim"],"description":"Incremental learning, leading to interactive human/machine learning, is key to the development of properly controllable, effective, and acceptable assistive devices. In this talk I will try to outline the benefits of using it, framing it in the more general paradigm of User-Centred Design.\n\nAbout the speaker: Claudio Castellini is a researcher in medical robotics, focussing on rehabilitation and assistive robotics, human-machine interfaces and interaction, and applied machine learning. After obtaining a degree in Biomedical Engineering in 1998 at the University of Genoa, Italy, he obtained a Ph.D. in Artificial Intelligence (Mathematical Logic) at the School of Informatics of the University of Edinburgh, Scotland, in 2005. Soon after, he turned his attention to robotics for the disabled, spending 4.5 years as a post-doctoral fellow at the Advanced Robotics Laboratory of the University of Genoa, Italy. In 2009, he was hired at the German Aerospace Centre where, as of now, he is a senior researcher and joint lab leader at the Institute of Robotics and Mechatronics. In 2021 he has been appointed full professor of medical robotics at the University of Erlangen-Nuremberg where he leads the Assistive Intelligent Robotics (AIROB) Lab and enjoys being the Deputy Dean for Public Relations and Communication of the Faculty of Engineering. As of now, he has co-authored about 160 scientific papers, he is involved in a few research projects at the Bavarian, German, and European levels, and serves as Associate Editor for the IEEE Transactions on Neural Systems and Rehabilitation Engineering, as a board member for the International Consortium for Rehabilitation Robotics (ICORR), as the organiser of the ICORR YouTube Channel and as an Editor / Associate Editor for BioRob, ICNR, and the RehabWeek.","talks":[]},{"id":"ws01","date":"2026-09-29","start":"09:30","end":"13:00","type":"workshop","code":"WS01","title":"Collaborative Digital Innovation in Neurorehabilitation: From Clinical Data to Real-World Application","room":"Room J","organizers":["José López Sánchez, Centro Europeo de Neurociencias (CEN), Spain","Dr. Liliana Paredes, ETH Zurich, Switzerland"],"description":"This workshop will bring together international experts and initiatives to showcase how clinical practice, research, and education can be synergistically integrated through digital tools for neurorehabilitation. The focus is on leveraging real-world data, interdisciplinary collaboration, and patient-centred approaches to advance evidence-based neurotechnology.\nPresentations will span complementary perspectives:\n• Digital Twins for Stroke Rehabilitation (Dr. Liliana Paredes): creating a scalable database and predictive models for personalized gait recovery after stroke\n• The MiNT Academy & CREATe (Alison Watt): establishing an international clinical research and education alliance to harmonize training, research, and guidelines in neurotechnology\n• Tech2people (Dennis Veit): co-developing digital rehab tools with continuous clinician feedback, emphasizing interoperability, usability, and standardized outcomes\n• Centro Europeo de Neurociencias (Dr. José López Sánchez): integrating digital platforms into daily clinical, research, and educational workflows— covering patient data collection, adaptive treatment plans, real-world studies, and the creation of tailored educational resources.\nThe workshop will close with a panel discussion to identify barriers, opportunities, and future directions for global neurorehabilitation networks.\n\nTopics of interest:\n1. Digital twins and predictive modelling in neurorehabilitation\n2. Clinical neurotechnology integration (BCI, robotics, exoskeletons, NIBS)\n3. Real-world data collection and clinical research platforms\n4. International multi-site collaboration and guideline development\n5. Co-development methodologies between clinicians, engineers, and industry\n6. Clinical education and knowledge transfer in neurorehabilitation","talks":[]},{"id":"ws02","date":"2026-09-29","start":"09:30","end":"17:30","type":"workshop","code":"WS02","title":"Neuromusculoskeletal Modeling Pipeline Training Workshop","room":"Room C","organizers":["Prof. B.J. Fregly, Rice University, USA"],"description":"This hands-on workshop will introduce ICNR attendees to the Neuromusculoskeletal Modeling (NMSM) Pipeline (https://nmsm.rice.edu), which is open-source Matlab-based software that adds Model Personalization and Treatment Optimization toolsets to the OpenSim musculoskeletal modeling software. In the morning session, attendees will complete hands-on tutorials to learn how to use the NMSM Pipeline’s Model Personalization and Treatment Optimization toolsets. Starting with a scaled generic OpenSim model and experimental motion capture, ground reaction, and EMG data, attendees will use the Model Personalization toolset to personalize 1) joint functional axes, 2) muscle-tendon model properties, 3) neural control model properties using muscle synergies, and 4) foot-ground contact model properties. Next, starting with this personalized model and the same experimental data, attendees will use the Treatment Optimization toolset to perform 1) a Tracking Optimization that closely reproduces all available experimental data using joint torque or muscle synergy controls, 2) a Verification Optimization that verifies the controls found by Tracking Optimization can reproduce the experimental data without tracking it, and finally 3) a Design Optimization that performs predictive simulations to design a clinical intervention. In the afternoon session, attendees will choose between two hands-on clinical treatment design projects, using the relevant NMSM Pipeline tools to complete the selected project. The first project will design a high tibial osteotomy surgery for an individual with bilateral medial knee osteoarthritis, with the goal of reducing the peak adduction moment in both knees to a desired value. The second project will design a synergy-based functional electrical stimulation prescription for the paretic leg of a subject post-stroke, with the goal of equalizing propulsive and braking impulse between the two legs while also increasing walking speed to a desired value.\n\nTopics of interest:\n1. Neuromusculoskeletal modeling\n2. Model personalization\n3. Computational treatment design\n4. Predictive walking simulation\n5. Stroke neurorehabilitation","talks":[]},{"id":"ws03","date":"2026-09-29","start":"09:30","end":"13:00","type":"workshop","code":"WS03","title":"AI-Driven FES for Personalized Neurorehabilitation: From Clinical Evidence to Hands-On Experience with the NeuroSkin® System","room":"Room I","organizers":["A. Metani, Kurage, France"],"description":"Functional Electrical Stimulation is a powerful tool to restore motor function and promote neuroplasticity in individuals with neurological impairments. Recent advances in wearable technologies, artificial intelligence, and connected health platforms now make it possible to deliver FES in a more personalized, adaptive, and data-driven way. This half-day workshop aims to provide clinicians, therapists, and researchers with a comprehensive introduction to multichannel FES and its integration into modern neurorehabilitation practice through the NeuroSkin® system.\nDeveloped by Kurage, NeuroSkin® is an AI-powered FES garment designed as a pair of trousers embedding dry textile electrodes and motion sensors. It enables real-time synchronized stimulation to key lower-limb muscle groups, supporting walking training in stroke, multiple sclerosis, spinal injury and other neuro-motor disorders. Combined with a clinical gait analysis platform, the system allows for remote monitoring, objective gait quantification, and adaptive stimulation parameter optimization.\nThe workshop will begin with a theoretical overview of multichannel FES principles, emphasizing motor control, neurophysiological mechanisms, and personalization strategies. A live demonstration will follow, during which volunteers will wear and test the NeuroSkin® device, experiencing its ability to detect movement intention and deliver intelligent stimulation patterns. The final session will present clinical results from daily rehabilitation practice, including case studies and outcomes from ongoing trials across multiple centers, highlighting improvements in gait speed, endurance, and patient engagement.\nParticipants will gain hands-on understanding of how AI-driven multichannel FES can be integrated into routine therapy to enhance recovery, motivation, and continuity of care. The session will foster open discussion on practical implementation, data-driven rehabilitation, and the future of connected.\n\nTopics of interest:\n1. Multichannel Functional Electrical Stimulation Therapies (MFEST)\n2. MFEST in daily clinical practice\n3. Embedded Clinical Gait Analysis\n4. Artificial Intelligence","talks":[]},{"id":"ws04","date":"2026-09-29","start":"09:30","end":"17:30","type":"workshop","code":"WS04","title":"Strategies for Reliable Assessment in Neurorehabilitation: Bridging Motor, Cognitive, and Technological Domains","room":"Room D","organizers":["Marianna Semprini, IIT, Italy","Jorge Gomez Garcia, CSIC, Spain","Diego Torricelli, CSIC, Spain"],"description":"(Listed in the at-a-glance grid as “Quantitative Assessment and Intervention of Spasticity”.)\n\nThe design of robust and scalable assessment protocols remains one of the greatest challenges in neurorehabilitation research and clinical translation. Reliable monitoring of motor and cognitive recovery requires the definition of clear strategies concerning which biomarkers, which tasks, which equipment, and which data formats should be adopted to ensure comparability and reproducibility across studies and clinical contexts.\nThis workshop will address these methodological and translational questions through a multidisciplinary lens. Discussion will focus on identifying meaningful biomarkers for both upper-and lower-limb rehabilitation; defining standardized tasks that capture functional recovery; and assessing equipment usability from both clinician and end-user perspectives. A specific emphasis will be placed on data harmonization and the need for common, open, and standardized formats to foster data sharing and large-scale analysis. Key factors influencing the design of assessment pipelines will also be explored, including the integration of cognitive and motor evaluations, the transition from lab-based to out-of-lab monitoring, and the adaptation of technologies to low-and middle-income settings, where device cost, clinician training, and user education play a critical role. Furthermore, the workshop will consider the implications of legal and ethical compliance and the expanding role of artificial intelligence in extracting clinically relevant information from multimodal datasets. Through talks, group discussions, and case-based sessions, participants will collaboratively identify research and implementation priorities for next-generation neurorehabilitation assessment.\nThe overall goal is to outline a roadmap toward continuous, AI-assisted, and standardized evaluation frameworks that can support clinical decision-making, enable global accessibility, and ultimately promote a more personalized and equitable rehabilitation practice.\n\nTopics of interest:\n1. Motor and cognitive assessment in neurorehabilitation\n2. Lab vs out-of-the-lab assessment\n3. High vs low-middle income countries\n4. Legal compliance\n5. Artificial Intelligence","talks":[]},{"id":"ws05","date":"2026-09-29","start":"09:30","end":"13:00","type":"workshop","code":"WS05","title":"The MetaBotic paradigm: unravelling the links between Mental Workload, Metabolism, and Biomechanics for enhanced lower limb wearable devices","room":"Room G","organizers":["Andrea Berettoni, IIT, Italy","Samuele De Giuseppe, IIT, Italy","Giulia Mariani, IIT, Italy"],"description":"Motor tasks—from simple movements like walking to complex daily activities—differ significantly between healthy individuals and users of lower limb assistive devices. Prosthesis and exoskeleton users often develop novel movement patterns to maintain functionality and safety, which can lead to compensatory strategies and, over time, neuro-musculoskeletal strain. Device characteristics critically influence gait and posture: constraints on natural joint motion may require conscious movement adjustments, increasing both physical effort and cognitive demand. While research has traditionally emphasized biomechanics, physical fatigue, typically assessed through metabolic cost, remains underexplored. Fatigue strongly affects daily performance, and measures such as heart rate and oxygen consumption offer valuable insights for optimizing device design and control strategies. Moreover, physical exertion and mental workload are closely linked: when sensory feedback or intuitive control is limited, users must rely on increased attention and cognitive effort. This can reduce walking speed, alter loading patterns, and raise energy consumption.\nThis workshop will examine the interplay between biomechanics, metabolic cost, and mental workload in lower limb prosthesis and exoskeleton use. Each topic will be introduced by the organizers, followed by invited talks presenting current research and perspectives. A final panel discussion will engage speakers and participants in exploring methodological challenges, research gaps, and opportunities for innovation. By fostering multidisciplinary dialogue that integrates physiological, cognitive, and mechanical aspects, the workshop aims to advance evaluation methods and guide the design of next-generation assistive technologies that enhance mobility, efficiency, and user comfort.\n\nTopics of interest:\n1. Lower Limb Prostheses\n2. Exoskeletons\n3. Human-Device Interaction\n4. Biomechanics\n5. Metabolic Cost\n6. Mental Workload\n7. User-centered design","talks":[]},{"id":"ws06","date":"2026-09-29","start":"14:00","end":"17:30","type":"workshop","code":"WS06","title":"Precise Biorobotic Rehabilitation: Targeting Tissue Adaptation via Multiscale Computational Models","room":"Room G","organizers":["Claudio Pizzolato, Australia","David Lloyd, Australia"],"description":"Rehabilitation technologies are rapidly evolving from devices that simply assist movement toward systems that actively shape biological recovery. A critical frontier is the ability to steering mechanobiological adaptation of tissues, such as bones, tendons, muscles, and neural pathways, through precisely controlled interventions. This workshop will explore how multiscale computational models of the neuromusculoskeletal system can be leveraged to design and deliver rehabilitation strategies aimed at recovery of function while also driving desirable adaptation of tissue.\nMultiscale models provide a unique bridge between levels of biological organization: from cellular mechanotransduction and muscle fibre recruitment, to joint loading, whole body kinematics, and neural control. By embedding these models into biorobotic platforms comprising of exoskeletons, electrical stimulation systems, and wearable robotics, we can move beyond generic therapy protocols toward personalised interventions that optimise loading conditions for each individual. This approach has the potential to accelerate recovery, reduce secondary complications such as osteoporosis or tendon degeneration, and provide quantifiable metrics for clinical decision making.\nThe workshop will feature a series of short presentations covering:\n• Emerging evidence from in-vitro bioreactor studies on tissue adaptation following mechanical response\n• Advances in multiscale modelling of isolated tissues and neuromusculoskeletal dynamics\n• Integration of multiscale computational models with biorobotic rehabilitation.\nTo conclude, a panel discussion will focus on debating the translational challenges: model validation, regulatory pathways, and clinical adoption. Participants will be invited to contribute perspectives on how to balance model complexity with usability, and how to design collaborative frameworks that ensure these technologies deliver meaningful outcomes for patients.\n\nTopics of interest:\n1. Mechanobiology\n2. Biorobotic\n3. Computational biology\n4. Rehabilitation","talks":[]},{"id":"ws07","date":"2026-09-29","start":"14:00","end":"17:30","type":"workshop","code":"WS07","title":"Towards a Multi-Center Data-Driven Evaluation System for Parkinson’s Disease: From Sensing to Clinical Application","room":"Room H","organizers":["Diego Torricelli, CSIC, Spain","Qi An, The University of Tokyo, Japan","Shingo Shimoda, Nagoya University, Japan"],"description":"Parkinson’s disease (PD) is a progressive neurodegenerative disorder characterized by heterogeneous motor and non-motor symptoms. Because the disease evolves over time, timely and individualized interventions are crucial to maintaining patients’ quality of life. However, current clinical assessments typically require patients to visit hospitals for physician-led evaluations, which are performed infrequently and may not capture symptom fluctuations or treatment effects in daily life.\nRecent advances in wearable sensing, digital biomarkers, and AI-based analysis have enabled continuous and objective monitoring of PD. Yet, most existing studies are conducted in isolated, singlesite environments, limiting the generalizability and clinical translation of developed models. Multi-site, international data collection is essential to capture the diversity of patient populations, healthcare systems, and measurement conditions—thereby ensuring robustness, fairness, and scalability of evaluation systems.\nThis workshop will bring together researchers, clinicians, and engineers to discuss the opportunities and challenges of building such a global framework for PD assessment. The session will focus on strategies for harmonizing multi-center data, validating AI models across populations, and establishing standardized, interoperable systems for neurorehabilitation and disease management.\n\nTopics of interest:\n1. Parkinson’s disease assessment\n2. Multi-center data collection\n3. AI and machine learning for clinical evaluation\n4. Digital biomarkers and digital mobility outcomes (DMO)","talks":[]},{"id":"ws08","date":"2026-09-29","start":"09:30","end":"13:00","type":"workshop","code":"WS08","title":"Maximizing Neuroplasticity in Neurorehabilitation through Multimodal and Restorative BCI Approaches","room":"Room E","organizers":["Hyung-Soon Park, KAIST, South Korea"],"description":"Recent advances in neurorehabilitation emphasize promoting neuroplasticity—the brain’s capacity to reorganize and form new connections—as a foundation for recovery after stroke and neurological injury. This workshop will introduce a multimodal, restorative Brain–Computer Interface (BCI) framework that integrates EEG-based intention decoding, adaptive electrical stimulation, soft robotics, and immersive VR/AR feedback to facilitate neuroplastic changes.\nRather than focusing solely on assistive control, the restorative BCI paradigm aims to reactivate impaired motor networks and reinforce functional reorganization through synchronized neural and sensory feedback. Presentations will cover key technological and clinical components: (1) development of soft wearable robots for synchronized neurofeedback and proprioceptive stimulation, (2) application of VR/ AR-based motor imagery and multimodal sensory environments to enhance cortical engagement, (3) EEG-based decoding of motor intention, fatigue, and attention for adaptive feedback, and (4) clinical integration and neurophysiological validation in stroke rehabilitation settings.\nBy combining expertise in engineering, neuroscience, and clinical neurorehabilitation, this session will discuss translational pathways from bench to bedside and explore how multimodal closed-loop systems can maximize neuroplasticity to restore motor function and patient engagement.\n\nTopics of interest:\n1. Brain–Computer Interface (BCI)\n2. Neuroplasticity and neural reorganization\n3. EEG-based motor intention decoding\n4. Restorative vs. assistive BCI paradigms\n5. Soft robotics and haptic feedback\n6. Virtual and augmented reality rehabilitation\n7. Multimodal stimulation and closed-loop feedback\n8. Clinical translation and neurorehabilitation outcomes","talks":[]},{"id":"ws09","date":"2026-09-29","start":"14:00","end":"17:30","type":"workshop","code":"WS09","title":"Intention-driven Gait Rehabilitation: Theories and Practical Evidences in Angel Robotics","room":"Room J","organizers":["Kyoungchul Kong, CTO, Angel Robotics Co., Ltd.","Dong-wook Rha, CMO, Angel Robotics / Severance Rehabilitation Hospital, Yonsei University College of Medicine","Daekyum Kim, School of Mechanical Engineering, Korea University","Won Hyuk Chang, Samsung Medical Center, Sungkyunkwan University School of Medicine","Jayoung Choi, Chungnam National University Hospital"],"description":"This workshop offers an in-depth presentation on the pioneering technology developed by Angel Robotics Co., Ltd. in their wearable gait assist exoskeletons and the resulting clinical efficacy in rehabilitation. Angel Robotics is a leader in the rehabilitation robotics field, featuring innovative products like the Angel Legs M20 (full body, hip and knee joint actuation) and the Angel Suit H10 (hip joint actuation). The topics will be covered in this workshop include (but are not limited to):\n• Gait Intention Recognition and Force Control: Utilizing built-in high-precision sensors and AI-based algorithms, the system accurately recognizes the user’s gait intention in real-time and provides only the necessary torque assistance to compensate for muscle weakness. This approach promotes active participation from the user, maximizing rehabilitation outcomes.\n• Transparent Actuation System: Through proprietary technology, the robot enables precise torque control with near-zero mechanical resistance, ensuring the device does not impede the user’s natural movement.\n• Modularization and Lightweight Design: The product line includes various models (Angel MEDI, Angel SUIT) tailored for rehabilitation and daily living assistance. The lightweight structure and easy donning/doffing system enhance user-friendliness for both clinicians and patients.\n• Enhanced Gait Rehabilitation: The system facilitates more than 5 times the repetitive gait training within limited therapy time compared to conventional rehabilitation, showing significant clinical improvements in gross motor function, balance control, and gait function for stroke patients and children with cerebral palsy.\n• Comprehensive Data Acquisition and AI modeling: Embedded sensors (e.g., joint angle, torque, force sensors, IMUs) capture vast amounts of high-fidelity data on user kinetics and kinematics during walking. This includes metrics like joint range of motion, ground reaction forces, torque provided by the robot, and real-time user intention signals.This robust dataset is used to train proprietary Machine Learning (ML) and Deep Learning (DL) models directly applied to create highly personalized and adaptive rehabilitation and healthcare solutions.","talks":[]},{"id":"ws10","date":"2026-09-29","start":"14:00","end":"17:30","type":"workshop","code":"WS10","title":"Quantifying Neuromechanics with Robotic Technologies","room":"Room I","organizers":["Dr. Junho Choi, KIST, South Korea","Prof. Sang Hoon Kang, UNIST, South Korea","Dr. Song Joo Lee, KIST, South Korea"],"description":"This workshop explores how sensory feedback and robotic technologies can quantify and enhance neuromechanical control in movement. Talks will highlight how cutaneous and proprioceptive modulation reshape motor strategies during walking and rehabilitation. Low-impedance robotic devices and EEG-guided platforms for proprioceptive recovery will be presented with clinical evidence. Novel metrics for motor adaptation will be introduced. Together, these studies bridge neuroscience, robotics, and rehabilitation toward closed-loop, personalized neurorehabilitation.\n• Cutaneous Modulation Changes Motor Strategy in Treadmill Walking with or without Prosthesis, Prof. Hangue Park\n• Robotic Device with Minimal Impedance for Gravity Support, Dr. Junho Choi\n• Robot-Assisted Evaluation and Recovery of Proprioception in Stroke Survivors With EEG-Guided Validation, Prof. Keonyoung Oh\n• How Linear Is The Multi-Joint Upper Limb Under Small-Magnitude Perturbations?, Dr. Seongil Hwang\n• Kinematic Changes During Rehabilitation in Individuals with Stroke, Dr. Junho Shin\n• Kinematic Adaptation During Motor Learning in Robot-Assisted Planar Upper-Limb Reaching Tasks, Prof. Jong Hyun Kim\n• Quantifying and Improving Neuromuscular Control in The Pivoting Direction: Dissociation between Muscle Mass and Pivoting Neuromuscular Control in Older Adults, Dr. Kyung-Mi Park\n\nTopics of interest:\n1. Sensorimotor Integration and Neuromechanical Adaptation\n2. Robotic Systems with Minimal Impedance for Natural Movement Support\n3. EEG-Guided Rehabilitation and Neurofeedback-Based Motor Recovery\n4. Robotic-Assisted Assessment and Recovery of Proprioception\n5. Neuromechanics in Pivoting Directions\n6. Quantitative Evaluation of Motor Learning during Rehabilitation\n7. Integrative Robotic Platforms for Sensory-Motor Training and Evaluation","talks":[]},{"id":"ws12","date":"2026-09-29","start":"14:00","end":"17:30","type":"workshop","code":"WS12","title":"Cross-Level Neural Stimulation Framework for Motor Recovery in Parkinson Disease","room":"Room F","organizers":["Jiyeon Kang, GIST, South Korea"],"description":"Parkinson’s disease (PD) involves progressive disconnection and maladaptive synchronization within motor neural pathways, leading to severe impairment in voluntary movement. To address this fundamental circuit dysfunction, this workshop introduces an electronic platform for rewiring neural circuits that integrates targeted electrical stimulation, motor behavior engagement, and AI-based signal analysis to restore effective communication across cortical and subcortical structures. Rather than focusing solely on symptom suppression, the proposed approach seeks to reactivate and reorganize residual neural connections to recover functional movement patterns. The workshop will highlight engineering strategies for multi-site stimulation design, neuro-motor biomarker extraction, and robotic-assisted training paradigms that collectively promote neuroplastic adaptation. By merging insights from neuroscience, rehabilitation robotics, and bioelectronic engineering, the session will propose a new therapeutic paradigm that reframes motor rehabilitation as a process of biological circuit restoration, ultimately aiming to improve autonomy and quality of life in individuals with degenerative motor disorders.\n*This research was supported by the Bio&Medical Technology Development Program of the National Research Foundation (NRF) funded by the Korean government (MSIT) (No. RS-2024-00361688).\n\nTopics of interest:\n1. Degenerative Disease Rehabilitation\n2. Brain Stimulation and Robotic Rehabilitation\n3. Mechanisms inhibiting Neurodegeneration\n4. Highly translational rehabilitation methodology","talks":[]},{"id":"ws13","date":"2026-09-29","start":"09:30","end":"13:00","type":"workshop","code":"WS13","title":"QEEG-guided precision neuromodulation","room":"Room F","organizers":["Seung-Wan Kang, CEO, iMedicine Inc., Professor, College of Nursing, Seoul National University"],"description":"This workshop is a hands-on program designed for participants to gain practical experience throughout the entire process, from high-quality dry EEG measurement to QEEG analysis, and the design of QEEG-based personalized neuromodulation. Aimed at researchers and postgraduate students in neuroengineering, neuroscience, and BCI, it seeks to enable the immediate application of cutting-edge AI-based quantitative EEG analysis and neuromodulation techniques such as tES, tMS, tPBM, and neurofeedback in both research and clinical settings. Part 1 focuses on understanding the core of QEEG analysis, centered on signal quality management and the interpretation of functional brain mapping within actual EEG measurement environments. Part 2 enables participants to learn the practical application workflow of quantitative EEG-based neuromodulation through designing and experiencing personalized tPBM protocols based on individual QEEG results. Through this, participants will gain practical, analytical, and design capabilities that can be immediately applied within their own research or clinical contexts, moving beyond mere theoretical acquisition.","talks":[]},{"id":"ws14","date":"2026-09-29","start":"14:00","end":"17:30","type":"workshop","code":"WS14","title":"Translational Research in Rehabilitation Robotics: From Hospital to Community Care","room":"Room E","organizers":["Won-Kyung Song, Ph.D., National Rehabilitation Center","Joon-Ho Shin, M.D., National Rehabilitation Center"],"description":"This workshop introduces the translational research program in rehabilitation robotics at the National Rehabilitation Center (NRC) and discusses its clinical applications across multiple rehabilitation domains. Translational research plays a critical role in bridging engineering innovation, regulatory readiness, and real-world clinical deployment of rehabilitation technologies.\nIn rehabilitation robotics, translational research typically consists of four key stages: technology improvement, testing, regulatory approval and certification, and clinical application. These stages ensure that newly developed robotic technologies can move systematically from laboratory prototypes to safe and effective use in clinical practice.\nRecent advances in rehabilitation robotics have evolved beyond laboratory prototypes toward evidence-based clinical interventions and service models that support functional recovery and long-term care. In particular, integrating robotic technologies into hospital-based rehabilitation and community care systems has become an important direction for improving accessibility and continuity of rehabilitation services.\nThis workshop will present clinical and translational research related to upper-limb rehabilitation, ankle and mobility rehabilitation, and pediatric rehabilitation robotics. Speakers will discuss clinical evidence, system design considerations, evaluation methods, and implementation strategies for integrating robotic rehabilitation technologies into healthcare and community environments.\nBy bringing together clinicians and engineers, the workshop aims to share practical insights into bench-to-bedside-to-community translational pathways and highlight future opportunities for expanding the role of rehabilitation robotics in healthcare systems.\n• Current Status and Future Directions of Translational Research in Rehabilitation Robotics, Won-Kyung Song, National Rehabilitation Center\n• Effects of Task-Oriented Upper Limb Rehabilitation Training, Joon-Ho Shin, National Rehabilitation Center\n• Ankle Rehabilitation Robots and Community Care, Myung-Jun Lim, National Rehabilitation Center\n• Clinical Applications of Pediatric Rehabilitation Robots, Hyun-Kyung Kim, National Rehabilitation Center","talks":[]},{"id":"ws15","date":"2026-09-29","start":"09:30","end":"13:00","type":"workshop","code":"WS15","title":"From Innovation to Clinical Adoption in Neurorehabilitation: Introducing the Winter School on Clinical Neurorehabilitation (WSCNR2027)","room":"Room B","organizers":["Manuel Murie, Hospital Ciudad de Telde, ICOT group, Canary Islands Institute of Neurological Sciences Foundation, Spain","José L. Pons, Shirley Ryan AbilityLab, Northwestern University, Chicago, U.S.A.; Canary Islands Institute of Neurological Sciences Foundation, Spain"],"description":"New technologies are reshaping neurorehabilitation, not only by expanding the range of available tools, but by changing how we assess patients, guide treatment decisions, and deliver therapy across the clinical pathway. The challenge, however, is no longer innovation alone. It is how to integrate these advances into everyday clinical practice in ways that are meaningful, practical, and sustainable. This workshop will bring together leading experts to discuss how robotics, wearable sensors, neuromodulation, artificial intelligence, and quantitative assessment are informing new neurorehabilitation treatments and helping move the field toward more personalized and data-informed care. The session will also serve to introduce the Winter School on Clinical Neurorehabilitation (WSCNR2027), a new initiative focused on the implementation and adoption of technology in clinical neurorehabilitation. Alongside invited talks and discussion, The workshop will include a brief interactive hands-on component in which participants will follow the journey from a clinical idea arising from everyday neurorehabilitation practice to the development of a technological solution, and its application to enhance the neurorehabilitation process. They will also see how technology can be used to assess cognitive-motor dual tasking and explore its effects on performance in a practical and engaging way.\n\nTopics of interest:\n1. AI and data-driven decision support in neurorehabilitation\n2. Robotics and wearable technologies in clinical workflows\n3. Neuromodulation and stimulation-informed therapies\n4. Quantitative assessment and biomarker-guided rehabilitation\n5. Personalized treatment design and computational models\n6. Clinical implementation, usability, and adoption\n7. Training and education for technology-enabled neurorehabilitation\n8. Patient-centered innovation and multidisciplinary translation","talks":[]},{"id":"ws16","date":"2026-09-29","start":"14:00","end":"17:30","type":"workshop","code":"WS16","title":"Brain-Computer Interfaces in Neurorehabilitation: From Movement Intention to Motor Recovery and Communication","room":"Room B","organizers":["g.tec medical engineering GmbH"],"description":"This workshop will provide a practical introduction to brain-computer interfaces for neurorehabilitation, with a focus on two major clinical application areas: BCI-supported motor recovery and BCI-based assessment and communication. After introducing the basic principles of EEG-based BCI, including signal acquisition, motor imagery, event-related potentials, real-time classification and feedback, the workshop will demonstrate how these concepts can be translated into clinical workflows.\nThe first part will focus on closed-loop motor rehabilitation using motor imagery, visual feedback and functional electrical stimulation, with recoveriX as a practical example. Participants will learn how movement intention can be detected from EEG activity and transformed into avatar feedback and FES-assisted movement to support active motor training.\nThe second part will focus on BCI-based assessment and communication in patients with severe neurological conditions, including disorders of consciousness and locked-in syndrome, with mindBEAGLE as a practical example. The workshop will introduce auditory, tactile and motor imagery-based paradigms for detecting command following and enabling basic communication.\nThe session will combine short presentations, live demonstrations, hands-on interaction, case-based discussion and a final panel discussion. Participants will gain a realistic understanding of how BCI technologies can be integrated into neurorehabilitation practice, how suitable patients can be selected, and how BCI results may support therapy and clinical decision-making.","talks":[]},{"id":"ws-coffee-am","date":"2026-09-29","start":"11:00","end":"11:30","type":"break","title":"Coffee break","room":"","talks":[]},{"id":"ws-lunch","date":"2026-09-29","start":"13:00","end":"14:00","type":"break","title":"Lunch break","room":"","talks":[]},{"id":"ws-coffee-pm","date":"2026-09-29","start":"15:30","end":"16:00","type":"break","title":"Coffee break","room":"","talks":[]},{"id":"opening-reception","date":"2026-09-29","start":"19:00","end":"21:00","type":"social","title":"Opening Reception, Welcome Cocktail & Music Festival (Rock Band)","room":"Room K (Grand Ballroom)","talks":[],"description":"Room K (Grand Ballroom, 2nd Floor, Main Lobby, Swiss Grand Hotel). Free, included in the ICNR2026 registration fee. Dress code: business casual."},{"id":"coffee-am-2026-09-30","date":"2026-09-30","start":"10:45","end":"11:15","type":"break","title":"Coffee break","room":"","talks":[],"description":"Poster presenters are welcome to stand at their poster."},{"id":"coffee-am-2026-10-01","date":"2026-10-01","start":"10:45","end":"11:15","type":"break","title":"Coffee break","room":"","talks":[],"description":"Poster presenters are welcome to stand at their poster."},{"id":"coffee-am-2026-10-02","date":"2026-10-02","start":"10:45","end":"11:15","type":"break","title":"Coffee break","room":"","talks":[],"description":"Poster presenters are welcome to stand at their poster."},{"id":"lunch-0930","date":"2026-09-30","start":"12:45","end":"13:30","type":"break","title":"Lunch break","room":"","talks":[]},{"id":"spotlight-angel","date":"2026-09-30","start":"13:30","end":"13:45","type":"spotlight","title":"Angel Robotics Spotlight Session","room":"Room A","talks":[]},{"id":"coffee-pm-0930","date":"2026-09-30","start":"16:00","end":"16:30","type":"break","title":"Coffee break","room":"","talks":[],"description":"Poster presenters are welcome to stand at their poster."},{"id":"city-tour","date":"2026-09-30","start":"18:00","end":"21:00","type":"social","title":"City Tour — Korean History and Culture Night: National Museum of Korea","room":"National Museum of Korea","talks":[],"description":"As a living vestige of Korea’s history and culture, the National Museum of Korea holds nearly 420,000 artifacts, from a Paleolithic hand axe and a golden crown of the Three Kingdoms Period to Goryeo celadons, Joseon paintings and modern-era Korea, with digital animations and VR exhibits."},{"id":"lunch-1001","date":"2026-10-01","start":"12:45","end":"13:45","type":"break","title":"Lunch break","room":"","talks":[]},{"id":"coffee-pm-1001","date":"2026-10-01","start":"16:00","end":"16:30","type":"break","title":"Coffee break","room":"","talks":[]},{"id":"poster-session","date":"2026-10-01","start":"16:30","end":"19:00","type":"poster","title":"Exhibition & Poster Session","room":"Poster & booth area","talks":[],"description":"Extended exhibition and poster session. Poster presenters stand at their posters for the whole session. Posters are on display for the full conference (removal by Friday 16:00)."},{"id":"banquet","date":"2026-10-01","start":"19:30","end":"22:00","type":"social","title":"Conference Banquet","room":"Room K (Grand Ballroom)","talks":[],"description":"Room K (Grand Ballroom, 2nd Floor, Main Lobby, Swiss Grand Hotel). Ticket: 100 USD, optional at registration, subject to availability. Dress code: business casual."},{"id":"lunch-1002","date":"2026-10-02","start":"12:45","end":"13:45","type":"break","title":"Lunch break","room":"","talks":[]},{"id":"closing","date":"2026-10-02","start":"16:00","end":"16:30","type":"ceremony","title":"Closing Session","room":"Room A","talks":[]},{"id":"tour-kist","date":"2026-10-02","start":"16:00","end":"18:00","type":"tour","title":"Lab & Clinical Tour: Korea Institute of Science and Technology (KIST)","room":"Off-site","talks":[],"description":"Max. 40 people. Korea Institute of Science and Technology (KIST) represents Korea’s modern scientific and technological advancement, founded to drive national innovation through cutting-edge research. Located in Seoul, KIST serves as a hub where fundamental science meets real-world applications, spanning fields such as robotics, materials, healthcare, and energy. With a strong emphasis on interdisciplinary collaboration and global partnerships, KIST reflects Korea’s transition into a knowledge-based society and offers visitors insight into how science and technology shape the nation’s present and future. Participants will be required to present a government-issued ID at entry and provide the following information: Full name Affiliation Contact information (e.g., mobile phone number)"},{"id":"tour-snu","date":"2026-10-02","start":"16:00","end":"18:00","type":"tour","title":"Lab & Clinical Tour: Seoul National University (SNU) – Robotics Research Group","room":"Off-site","talks":[],"description":"Max. 40 people. The Seoul National University Robotics Research Group represents a multidisciplinary research initiative at Seoul National University that brings together diverse laboratories working at the forefront of robotics, artificial intelligence, and human-centered technologies. Spanning areas such as soft and bio-inspired robotics, robot learning, computer vision, healthcare and wearable robotics, and autonomous systems, the program focuses on developing intelligent machines that can safely and effectively interact with humans and complex environments. Its research emphasizes both fundamental advances—such as novel actuators, sensing technologies, and learning algorithms—and real-world applications in healthcare, industrial automation, and service robotics, reflecting a broader mission to translate cutting-edge engineering into impactful solutions that enhance human capability and quality of life."},{"id":"tour-angel","date":"2026-10-02","start":"16:00","end":"18:00","type":"tour","title":"Lab & Clinical Tour: Angel Robotics","room":"Off-site","talks":[],"description":"Max. 40 people. Angel Robotics is a wearable robotics company founded in 2017, dedicated to advancing technologies and commercialization in line with its mission, “Recreating Human Ability with Technology.” The company focuses on healthcare while expanding into defense and industrial safety. Angel Robotics’ core technology is based on real-time interaction between the robot and the user, enabling precise intention recognition and refined force control. These technological capabilities have been validated through gold medals at the Cybathlon in 2020 and 2024. Key products include the “ANGEL LEGS M20,” a multi-joint wearable robot, and the “ANGEL SUIT H10,” a hip-assist wearable robot, both used for overground gait training."},{"id":"tour-nrc","date":"2026-10-02","start":"16:00","end":"18:00","type":"tour","title":"Lab & Clinical Tour: National Rehabilitation Center (NRC)","room":"Off-site","talks":[],"description":"Max. 40 people. The National Rehabilitation Center (NRC), operated by the Ministry of Health and Welfare of the Republic of Korea, is a public institution dedicated to rehabilitation medicine, research, and public rehabilitation services. NRC provides specialized clinical rehabilitation services for people with disabilities, including individuals recovering from stroke, spinal cord injury, and musculoskeletal conditions, while also conducting advanced research in rehabilitation robotics, assistive technologies, and digital health. In particular, NRC carries out translational research programs in both rehabilitation robots and care robots, helping bridge the gap between technology development, clinical application, and real-world service implementation. In addition, NRC trains healthcare professionals and supports the development of national rehabilitation policies and standards. Through these integrated functions, it plays a central role in promoting functional recovery, independence, and social reintegration for people with disabilities in Korea. During this site visit, participants will have the opportunity to explore key facilities that demonstrate how the NRC integrates research, clinical practice, and service innovation in rehabilitation and care robotics. Visit Highlights: 1) Smart Care Space (2F, Nuri Building). A demonstration space featuring care robots and smart care technologies designed for daily living and support in real-world care environments. 2) Rehabilitation Robot Gym (2F, Narae Building). A research-oriented space dedicated to translational research in rehabilitation robotics, where advanced robotic systems are developed, tested, and evaluated. 3) Robot-Assisted Therapy Room (1F, Main Hospital Building). A clinical treatment space where rehabilitation robots are actively used in therapy, showing how robotic technologies are integrated into patient care."}]}
